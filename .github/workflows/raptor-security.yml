name: RAPTOR Security
# Reusable workflow is centrally maintained in Stijnman/Stijnman.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  raptor:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    uses: Stijnman/Stijnman/.github/workflows/raptor-reusable.yml@45265ff81e3ee05a6f7be85ebd3ed45ab1e0d1bc
    with:
      run_sca: true
