name: RAPTOR Security
# Reusable workflow is centrally maintained in Stijnman/Stijnman.
# A new PR run picks up the centrally corrected separate SARIF upload categories.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  raptor:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    uses: Stijnman/Stijnman/.github/workflows/raptor-reusable.yml@main
    with:
      run_sca: true
