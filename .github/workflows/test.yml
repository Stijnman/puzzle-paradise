name: Test Puzzle Paradise

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-javascript:
    name: Validate JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Syntax-check all JavaScript
        run: |
          find js assets tests e2e -type f \( -name "*.js" -o -name "*.mjs" \) -print0 | xargs -0 -n1 node --check
          node --check sw.js
          node -e "for (const f of require('fs').readdirSync('i18n')) JSON.parse(require('fs').readFileSync('i18n/'+f,'utf8'))"

  repository-tests:
    name: Repository Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Run contract tests
        run: node --test tests/*.test.mjs

  lint:
    name: Lint Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install markdownlint
        run: npm install --global markdownlint-cli2
      - name: Lint Markdown
        run: markdownlint-cli2 --config .markdownlint.json "**/*.md" "#node_modules"

  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install codespell
        run: python -m pip install codespell
      - name: Check spelling
        run: |
          codespell --skip ".git,*.json,*.yml,*.yaml,CHANGELOG.md,node_modules" \
            --ignore-words-list "competitor,researcher,gemini,typescript,react,express,api,AI,http,https" \
            --check-filenames \
            --check-hidden

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: TruffleHog scan on push or PR
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: trufflesecurity/trufflehog@v3.82.7
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified
      - name: Skip secret scan for manual runs
        if: ${{ github.event_name != 'push' && github.event_name != 'pull_request' }}
        run: echo "Manual workflow run; no comparison base is available."

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install tooling
        run: |
          python -m pip install --upgrade "pre-commit>=3.8.0" "identify>=2.6.0"
          npm install --global markdownlint-cli2
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  browser-e2e:
    name: Browser E2E + Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install browser test dependencies
        run: npm install --ignore-scripts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
