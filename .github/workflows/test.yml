name: Test Puzzle Paradise

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check if Node project exists
        id: node_project
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_json=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: ${{ steps.node_project.outputs.has_package_json == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        if: ${{ steps.node_project.outputs.has_package_json == 'true' }}
        run: npm ci

      - name: TypeScript type check
        if: ${{ steps.node_project.outputs.has_package_json == 'true' }}
        run: npx tsc --noEmit

      - name: Lint check
        if: ${{ steps.node_project.outputs.has_package_json == 'true' }}
        run: npm run lint

      - name: Skip JS validation
        if: ${{ steps.node_project.outputs.has_package_json != 'true' }}
        run: echo "No package.json found; skipping JavaScript validation."

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check if Node project exists
        id: node_project
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_package_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package_json=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: ${{ steps.node_project.outputs.has_package_json == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        if: ${{ steps.node_project.outputs.has_package_json == 'true' }}
        run: npm ci

      - name: Run tests
        if: ${{ steps.node_project.outputs.has_package_json == 'true' }}
        run: npm test

      - name: Skip test execution
        if: ${{ steps.node_project.outputs.has_package_json != 'true' }}
        run: echo "No package.json found; skipping test execution."

  lint:
    name: Lint Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install markdownlint
        run: npm install -g markdownlint-cli2

      - name: Lint all markdown files
        run: |
          find . -name "*.md" -type f -not -path "./.git/*" -exec markdownlint-cli2 --config .markdownlint.json {} \;

  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install codespell
        run: pip install codespell

      - name: Check spelling
        run: |
          codespell --skip ".git,*.json,*.yml,*.yaml,CHANGELOG.md,node_modules" \
            --ignore-words-list "competitor,researcher,gemini,typescript,react,express,api,AI,http,https" \
            --check-filenames \
            --check-hidden

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: TruffleHog scan on push or PR
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: trufflesecurity/trufflehog@v3.82.7
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --debug --only-verified

      - name: Skip secret scan for manual runs
        if: ${{ github.event_name != 'push' && github.event_name != 'pull_request' }}
        run: echo "Manual workflow run; skipping TruffleHog secret scan."

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if pre-commit config exists
        id: precommit
        shell: bash
        run: |
          if [ -f .pre-commit-config.yaml ]; then
            echo "has_precommit=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_precommit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.precommit.outputs.has_precommit == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        if: ${{ steps.precommit.outputs.has_precommit == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install pre-commit and Python compatibility deps
        if: ${{ steps.precommit.outputs.has_precommit == 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "pre-commit>=3.8.0" "identify>=2.6.0"
          npm install -g markdownlint-cli2

      - name: Install pre-commit hooks
        if: ${{ steps.precommit.outputs.has_precommit == 'true' }}
        run: pre-commit install

      - name: Run pre-commit on all files
        if: ${{ steps.precommit.outputs.has_precommit == 'true' }}
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Skip pre-commit
        if: ${{ steps.precommit.outputs.has_precommit != 'true' }}
        run: echo "No pre-commit config found; skipping pre-commit checks."
