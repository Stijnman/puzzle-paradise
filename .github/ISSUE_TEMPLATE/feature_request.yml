name: Feature request
description: Suggest a puzzle or an improvement to Puzzle Paradise
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: request-type
    attributes:
      label: Request type
      options:
        - Add a puzzle
        - Improve an existing puzzle
        - Improve the site or interface
        - Accessibility improvement
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What would this change solve or improve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List other approaches or existing puzzles you considered.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help test or implement this request.
