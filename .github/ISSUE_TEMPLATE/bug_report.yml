name: Bug report
description: Report a reproducible problem in Puzzle Paradise
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Puzzle Paradise.
  - type: dropdown
    id: puzzle
    attributes:
      label: Puzzle
      description: Which puzzle is affected?
      options:
        - Site or puzzle selector
        - A specific puzzle
        - Multiple puzzles
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 143 on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Paste console output or drag screenshots here. Remove sensitive information first.
      render: shell
