# Pre-commit hooks configuration for Puzzle Paradise
# Install with: pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json
      - id: pretty-format-json
        args: ['--autofix', '--indent=2', '--no-ensure-ascii']

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --skip=.git,*.json,*.yml,*.yaml,CHANGELOG.md,node_modules
          - --ignore-words-list=competitor,researcher,gemini,typescript,react,express,api,AI,http,https
          - --check-filenames
          - --check-hidden

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: .git/

  - repo: local
    hooks:
      - id: markdownlint
        name: Markdown lint
        entry: markdownlint-cli2 --config .markdownlint.json
        language: system
        types: [markdown]
        exclude: CHANGELOG.md
      - id: javascript-syntax-check
        name: JavaScript syntax check
        entry: bash -c 'for file in "$@"; do node --check "$file" || exit 1; done' --
        language: system
        files: \.(js|mjs)$
      - id: repository-contract-tests
        name: Repository contract tests
        entry: node --test tests/*.test.mjs
        language: system
        pass_filenames: false
        always_run: true
